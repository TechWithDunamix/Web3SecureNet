<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Key Logo (larger) -->
  <g transform="translate(100, 200)">
    <circle cx="50" cy="50" r="36" fill="none" stroke="url(#keyGradient)" stroke-width="8"/>
    <circle cx="50" cy="50" r="16" fill="none" stroke="url(#keyGradient)" stroke-width="6"/>
    <rect x="70" y="44" width="90" height="12" fill="url(#keyGradient)" rx="6"/>
    <rect x="130" y="56" width="16" height="24" fill="url(#keyGradient)" rx="4"/>
    <rect x="150" y="56" width="10" height="16" fill="url(#keyGradient)" rx="2"/>
    <circle cx="50" cy="50" r="6" fill="#ffffff"/>
  </g>
  
  <!-- Title -->
  <text x="350" y="280" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">
    Web3SecureNet
  </text>
  
  <!-- Subtitle -->
  <text x="350" y="340" font-family="Arial, sans-serif" font-size="32" fill="#e5e7eb">
    Advanced Blockchain Security Solutions
  </text>
  
  <!-- Features -->
  <text x="350" y="400" font-family="Arial, sans-serif" font-size="24" fill="#d1d5db">
    🔒 Smart Contract Auditing
  </text>
  <text x="350" y="440" font-family="Arial, sans-serif" font-size="24" fill="#d1d5db">
    🛡️ DeFi Security Protection
  </text>
  <text x="350" y="480" font-family="Arial, sans-serif" font-size="24" fill="#d1d5db">
    🔐 Web3 Application Security
  </text>
</svg>