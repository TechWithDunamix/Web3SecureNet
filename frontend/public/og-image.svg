<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main key icon -->
  <g transform="translate(150, 200)">
    <!-- Key body -->
    <circle cx="60" cy="60" r="45" fill="none" stroke="url(#keyGradient)" stroke-width="8"/>
    <circle cx="60" cy="60" r="20" fill="none" stroke="url(#keyGradient)" stroke-width="6"/>
    
    <!-- Key shaft -->
    <rect x="90" y="52" width="120" height="16" fill="url(#keyGradient)" rx="8"/>
    
    <!-- Key teeth -->
    <rect x="180" y="68" width="20" height="30" fill="url(#keyGradient)" rx="4"/>
    <rect x="200" y="68" width="15" height="20" fill="url(#keyGradient)" rx="3"/>
    <rect x="215" y="68" width="10" height="25" fill="url(#keyGradient)" rx="2"/>
    
    <!-- Security elements -->
    <circle cx="60" cy="60" r="8" fill="#ffffff"/>
    <rect x="110" y="56" width="4" height="8" fill="#ffffff" rx="2"/>
    <rect x="120" y="56" width="4" height="8" fill="#ffffff" rx="2"/>
    <rect x="130" y="56" width="4" height="8" fill="#ffffff" rx="2"/>
    <rect x="140" y="56" width="4" height="8" fill="#ffffff" rx="2"/>
  </g>
  
  <!-- Title -->
  <text x="500" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
    Web3SecureNet
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="260" font-family="Arial, sans-serif" font-size="36" fill="url(#accentGradient)">
    Advanced Blockchain Security Solutions
  </text>
  
  <!-- Features -->
  <g transform="translate(500, 320)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">
      ✓ Smart Contract Auditing
    </text>
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">
      ✓ DeFi Security Solutions
    </text>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">
      ✓ Web3 Application Protection
    </text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="1000" cy="150" r="80" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="1050" cy="400" r="60" fill="url(#keyGradient)" opacity="0.1"/>
  <circle cx="950" cy="500" r="40" fill="#ffffff" opacity="0.05"/>
  
  <!-- Security shield icon -->
  <g transform="translate(900, 300)">
    <path d="M50 10 L90 30 L90 70 C90 90 70 100 50 100 C30 100 10 90 10 70 L10 30 Z" 
          fill="none" stroke="url(#accentGradient)" stroke-width="3" opacity="0.6"/>
    <path d="M35 50 L45 60 L65 40" fill="none" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>